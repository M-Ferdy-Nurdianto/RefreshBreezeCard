<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refresh Breeze - Members Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img src="logo.webp" alt="Refresh Breeze Logo" class="logo" />
      </div>
      <h1 class="main-title">Refresh Breeze</h1>
      <p class="subtitle">Our Lovely Members</p>
    </header>

    <main class="member-section">
      <h2 class="member-title">Member List</h2>
      <div class="grid">
        <!-- ACA -->
        <a href="aca/" class="member-card">
          <div class="card-inner">
            <div class="img-container">
              <img src="aca/assets/aca-eYbTfbmw.webp" alt="ACA" />
            </div>
            <span class="name">ACA</span>
            <div class="view-btn">View Profile</div>
          </div>
        </a>

        <!-- CHANNIE -->
        <a href="channie/" class="member-card">
          <div class="card-inner">
            <div class="img-container">
              <img src="channie/assets/channie-CEjgqWIU.webp" alt="CHANNIE" />
            </div>
            <span class="name">CHANNIE</span>
            <div class="view-btn">View Profile</div>
          </div>
        </a>

        <!-- CISSI -->
        <a href="cissi/" class="member-card">
          <div class="card-inner">
            <div class="img-container">
              <img src="cissi/assets/cissi-D1fdAu3Z.webp" alt="CISSI" />
            </div>
            <span class="name">CISSI</span>
            <div class="view-btn">View Profile</div>
          </div>
        </a>

        <!-- PIYA -->
        <a href="piya/" class="member-card">
          <div class="card-inner">
            <div class="img-container">
              <img src="piya/assets/piya-Cneaooxy.webp" alt="PIYA" />
            </div>
            <span class="name">PIYA</span>
            <div class="view-btn">View Profile</div>
          </div>
        </a>
      </div>
    </main>

    <footer
      style="
        margin-top: 4rem;
        padding-bottom: 2rem;
        opacity: 0.6;
        font-size: 0.9rem;
      "
    >
      &copy; 2026 Refresh Breeze. All Rights Reserved.
    </footer>
  </body>
</html>
